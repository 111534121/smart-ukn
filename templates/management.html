<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{role}}工作台</title>
<style>body{font:16px/1.7 system-ui;background:#f2f5fa;color:#163346;max-width:850px;margin:auto;padding:24px}section{background:white;padding:24px;border-radius:12px;margin:18px 0}button,a{display:inline-block;padding:12px;cursor:pointer}input,textarea{box-sizing:border-box;width:100%;padding:12px}textarea{min-height:150px}label{display:block;margin:12px 0}select{display:block;width:100%;max-width:100%;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.account{border-top:1px solid #ddd;padding:12px 0}.account button{margin-left:12px}</style>
<h1>{{role}}工作台</h1><a href="/">返回官網</a><button id="logout">登出</button>
{% if role == '內容管理員' %}<p>維護公開規章、同義詞、招生與課務 PDF；無法存取系統稽核、學生個資或承辦審核。</p>
<section><h2>校規內容維護</h2><label>選擇規章 <select id="rules"></select></label><label>內容<textarea id="content"></textarea></label><button id="save">儲存修改</button><p id="message" role="status"></p></section><a href="/admin-knowledge-documents">文件上傳與管理</a>
{% else %}<p>檢視系統稽核與執行系統檢查；公開內容請交由內容管理員維護。</p><section><h2>帳號查詢與密碼重設</h2><p>可依姓名、帳號或學號查詢。系統不顯示原密碼。</p><label>搜尋帳號<input id="accountQuery" autocomplete="off" placeholder="輸入姓名、帳號或學號"></label><button id="accountSearch">查詢</button><p id="accountStatus" role="status"></p><div id="accountResults"></div><p id="resetResult" role="status"></p></section><section><h2>系統維護</h2><button id="audit">讀取修改紀錄</button><button id="check">執行系統檢查</button><pre id="result" role="status"></pre></section>{% endif %}
<script>
async function call(url, options={}){const r=await fetch(url,options),d=await r.json();if(!r.ok)throw Error(d.message||'操作失敗');return d;}
document.getElementById('logout').onclick=async()=>{await call('/api/auth/logout',{method:'POST'});location.href='/login';};
{% if role == '內容管理員' %}
let rows=[];const select=document.getElementById('rules'),content=document.getElementById('content'),message=document.getElementById('message');
function show(){content.value=rows.find(r=>String(r.id)===select.value)?.content||'';}
async function load(){const d=await call('/api/rules');rows=d.data;select.replaceChildren(...rows.map(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.keyword||r.official_term||r.id;return o;}));show();}
select.onchange=show;document.getElementById('save').onclick=async()=>{try{await call('/api/rules/'+select.value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content.value})});rows.find(r=>String(r.id)===select.value).content=content.value;message.textContent='已儲存，並留下修改紀錄。';}catch(e){message.textContent=e.message;}};load().catch(e=>message.textContent=e.message);
{% else %}
document.getElementById('accountSearch').onclick=async()=>{const box=document.getElementById('accountResults'),status=document.getElementById('accountStatus');box.replaceChildren();document.getElementById('resetResult').textContent='';try{const d=await call('/api/management/accounts?q='+encodeURIComponent(document.getElementById('accountQuery').value));status.textContent=d.data.length?`找到 ${d.data.length} 筆${d.source==='demo'?'（示範資料，資料庫未連線）':''}`:'查無帳號';for(const u of d.data){const row=document.createElement('div');row.className='account';const label=document.createElement('span');label.textContent=`${u.full_name}｜${u.username}｜${u.role}${u.student_id?'｜'+u.student_id:''}`;row.append(label);if(d.source==='database'&&!['系統管理員','管理員'].includes(u.role)){const btn=document.createElement('button');btn.textContent='重設密碼';btn.onclick=async()=>{if(!confirm(`確定要重設 ${u.full_name}（${u.username}）的密碼？舊密碼將立即失效。`))return;try{const x=await call(`/api/management/accounts/${u.user_id}/reset-password`,{method:'POST'});document.getElementById('resetResult').textContent=`${u.username} 的臨時密碼：${x.temporary_password}。請立即安全交給本人；離開或再次查詢後將不再顯示。`;}catch(e){document.getElementById('resetResult').textContent=e.message;}};row.append(btn);}box.append(row);}}catch(e){status.textContent=e.message;}};
document.getElementById('accountQuery').onkeydown=e=>{if(e.key==='Enter')document.getElementById('accountSearch').click();};
async function run(url,options){try{document.getElementById('result').textContent=JSON.stringify(await call(url,options),null,2);}catch(e){document.getElementById('result').textContent=e.message;}}
document.getElementById('audit').onclick=()=>run('/api/admin/audit-logs');document.getElementById('check').onclick=()=>run('/api/admin/self-check',{method:'POST'});
{% endif %}
</script></html>
