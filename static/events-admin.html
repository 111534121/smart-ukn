<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>活動報名｜報名者管理</title>
<link rel="stylesheet" href="/css/admin-workbench.css?v=20261022">
<link rel="stylesheet" href="/css/events-admin.css?v=20261022">
</head>
<body>
<header>
  <a href="/">康寧大學 <span>UKN</span></a>
  <nav><a href="/">返回校務首頁</a><a href="/admin">管理後台</a><span id="identity"></span></nav>
</header>
<main>
  <section class="hero">
    <div>
      <p class="eyebrow">CAMPUS SERVICES · 活動報名</p>
      <h1>報名者管理</h1>
      <p class="muted">新增、修改、刪除報名者，重寄通知信，掌握候補與出席狀況。</p>
    </div>
    <div class="actions">
      <button id="sendReminders" type="button">寄送明天活動提醒信</button>
      <button id="refresh" type="button">重新整理</button>
    </div>
  </section>
  <p id="message" role="status" aria-live="polite"></p>

  <section class="card">
    <div class="sectionhead"><h2>建立新活動</h2><button type="button" id="createEventToggle">顯示表單</button></div>
    <form id="createEventForm" hidden>
      <div class="formgrid">
        <label>活動名稱<input name="title" maxlength="100" required placeholder="例如：系學會迎新茶會"></label>
        <label>地點<input name="location" maxlength="100" required placeholder="例如：康寧樓 1 樓中廊"></label>
        <label>活動日期<input name="event_date" type="date" required></label>
        <label>活動時間（選填）<input name="event_time" type="time"></label>
        <label>報名截止日<input name="registration_deadline" type="date" required></label>
        <label>名額<input name="capacity" type="number" min="1" required></label>
        <label>活動說明（選填）<textarea name="description" maxlength="2000" rows="2"></textarea></label>
        <label>活動圖片網址（選填）<input name="image_url" type="url" maxlength="500"></label>
      </div>
      <button class="primary" type="submit">建立活動</button>
    </form>
  </section>

  <section class="card">
    <h2>選擇活動</h2>
    <div class="formgrid">
      <label>活動<select id="eventSelect"><option value="">載入中…</option></select></label>
      <label>搜尋報名者<input id="search" type="search" placeholder="姓名、學號或 Email"></label>
    </div>
    <div id="eventActions" class="actions" hidden></div>
    <div id="eventStats" class="stats" hidden></div>
    <form id="qrCheckinForm" class="qr-checkin" hidden>
      <label>QR Code／簽到碼簽到<input id="checkinCodeInput" type="text" placeholder="用掃碼裝置掃學生的入場 QR Code，或貼上簽到碼" autocomplete="off"></label>
      <button class="primary" type="submit">簽到</button>
    </form>
    <div id="feedbackSummary" hidden></div>
  </section>

  <section id="addSection" class="card" hidden>
    <h2>新增報名者</h2>
    <p class="muted">用於現場或電話報名；不受線上報名截止日限制，名額滿了會自動轉候補。</p>
    <form id="addForm">
      <div class="formgrid">
        <label>學號<input name="student_id" maxlength="20" required placeholder="例如 S112001"></label>
        <label>姓名<input name="full_name" maxlength="50" required></label>
        <label>Email<input name="email" type="email" maxlength="100" required></label>
        <label>電話（選填）<input name="phone" type="tel" maxlength="30" placeholder="例如 0912-345-678"></label>
        <label>年齡<input name="age" type="number" min="1" max="120" required></label>
        <label>備註（選填）<input name="note" maxlength="200"></label>
      </div>
      <button class="primary" type="submit">新增報名者</button>
    </form>
  </section>

  <section id="broadcastSection" class="card" hidden>
    <h2>自訂通知信</h2>
    <p class="muted">自己打標題跟內容，寄給這場活動目前所有有效的報名者（已報名＋候補中，不含已取消）；要只寄給某一人可以用報名名單裡的「自訂通知」。</p>
    <form id="broadcastForm">
      <div class="formgrid">
        <label>標題<input name="subject" maxlength="100" required placeholder="例如：活動地點異動"></label>
        <label>內容<textarea name="body" maxlength="2000" required rows="3" placeholder="例如：因場地關係，活動改到活動中心二樓舉行，請留意。"></textarea></label>
      </div>
      <button class="primary" type="submit">寄給全部有效報名者</button>
    </form>
  </section>

  <section class="card">
    <div class="sectionhead">
      <div><h2>報名名單</h2><p id="listScope" class="muted"></p></div>
    </div>
    <div id="regList" class="case-list">請先選擇活動。</div>
  </section>

  <section id="eventEditPanel" class="card" hidden aria-label="編輯活動" tabindex="-1">
    <div class="sectionhead"><h2>編輯活動</h2><button type="button" id="eventEditCancel">關閉</button></div>
    <form id="eventEditForm">
      <div class="formgrid">
        <label>活動名稱<input name="title" maxlength="100" required></label>
        <label>地點<input name="location" maxlength="100" required></label>
        <label>活動日期<input name="event_date" type="date" required></label>
        <label>活動時間（選填）<input name="event_time" type="time"></label>
        <label>報名截止日<input name="registration_deadline" type="date" required></label>
        <label>名額<input name="capacity" type="number" min="1" required></label>
        <label>活動說明（選填）<textarea name="description" maxlength="2000" rows="2"></textarea></label>
        <label>活動圖片網址（選填）<input name="image_url" type="url" maxlength="500"></label>
      </div>
      <button class="primary" type="submit">儲存修改</button>
    </form>
  </section>

  <section id="editPanel" class="card" hidden aria-label="編輯報名者" tabindex="-1">
    <div class="sectionhead"><h2>編輯報名者</h2><button type="button" id="editCancel">關閉</button></div>
    <form id="editForm">
      <div class="formgrid">
        <label>學號<input name="student_id" maxlength="20" required></label>
        <label>姓名<input name="full_name" maxlength="50" required></label>
        <label>Email<input name="email" type="email" maxlength="100" required></label>
        <label>電話（選填）<input name="phone" type="tel" maxlength="30"></label>
        <label>年齡<input name="age" type="number" min="1" max="120" required></label>
        <label>備註（選填）<input name="note" maxlength="200"></label>
      </div>
      <button class="primary" type="submit">儲存修改</button>
    </form>
  </section>
</main>
<footer>康寧大學 · 活動報名服務</footer>
<script src="/js/events-admin.js?v=20261022"></script>
</body>
</html>
