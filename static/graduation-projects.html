<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資管科畢業專題｜康寧大學</title><link rel="stylesheet" href="/css/activities.css?v=20261029-role-ui"><style>.project-step{border-left:4px solid #003377;padding-left:14px;margin:18px 0}.task-alert{border-left:5px solid #b42318}.inline-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.inline-form label{flex:1;min-width:180px}.stage-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stage{border:1px solid #dbe5f1;border-radius:10px;padding:12px}.stage.pending{border-color:#e8b6b2;background:#fff9f8}@media(max-width:680px){.stage-grid{grid-template-columns:1fr}}</style></head><body>
<header><strong>康寧大學 · 資管科畢業專題</strong><a href="/">回首頁</a></header><main><section class="hero"><div><p class="eyebrow">CS GRADUATION PROJECT</p><h1 id="title">畢業專題</h1><p id="intro" class="muted">組隊、導師媒合與分階段審核。</p></div><span id="role" class="role-chip"></span></section><p id="message" class="notice" role="status" aria-live="polite"></p>
<section id="studentTools" class="card" hidden><h2>建立或加入小組</h2><div class="grid"><form id="createTeam"><label>專題名稱<input name="title" required maxlength="100" placeholder="例如 智慧校園服務系統"></label><div class="actions"><button>建立小組</button></div></form><form id="joinTeam"><label>隊友分享的加入碼<input name="join_code" required maxlength="8" placeholder="8 碼加入碼"></label><div class="actions"><button class="secondary">加入小組</button></div></form></div><p class="muted small">每位學生只能加入一組；最多 6 人。組長提交導師志願序。</p></section>
<section id="assistantTools" class="card" hidden><div class="section-head"><div><p class="eyebrow">科助工作台</p><h2>導師媒合與催審</h2></div><button id="matchButton">依志願序一鍵媒合</button></div><p class="muted">依小組建立順序處理志願序，每位老師最多指導 3 組。未媒合的小組保留供人工處理。</p><div id="assistantStats" class="stat-grid"></div><p class="muted small">每份文件 12 小時內最多提醒一次；超過 7 天會標記升級。LINE、Email 與系主任抄送需正式收件資料與服務串接。</p></section>
<section id="teacherTools" class="card task-alert" hidden><h2>🔴 我的專題審核待辦 <span id="pendingCount" class="badge"></span></h2><div id="teacherTasks"></div></section>
<section><h2>專題小組</h2><div id="teamList">載入中…</div></section></main><script src="/js/graduation-projects.js?v=20261029"></script></body></html>
