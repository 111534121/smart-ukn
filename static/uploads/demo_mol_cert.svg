<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#fef6e4"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
  </defs>
  <rect x="15" y="15" width="770" height="530" rx="16" fill="url(#certBg)" stroke="url(#goldBorder)" stroke-width="12"/>
  <rect x="35" y="35" width="730" height="490" rx="10" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="8,4"/>
  
  <text x="400" y="90" font-family="'Noto Sans TC', sans-serif" font-size="28" font-weight="bold" fill="#78350f" text-anchor="middle">勞動部勞動力發展署 技能檢定中心</text>
  <text x="400" y="130" font-family="'Noto Sans TC', sans-serif" font-size="20" font-weight="600" fill="#92400e" text-anchor="middle">中華民國技術士證書 (Skill Certificate)</text>
  
  <line x1="200" y1="150" x2="600" y2="150" stroke="#d4af37" stroke-width="2"/>
  
  <text x="120" y="210" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">姓名：<tspan font-weight="bold">王小明</tspan></text>
  <text x="120" y="250" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">身分識別：<tspan font-weight="bold">S112001 (資訊科技與應用學系)</tspan></text>
  <text x="120" y="290" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">職類名稱：<tspan font-weight="bold" fill="#0f2b5c">乙級電腦軟體應用技術士</tspan></text>
  <text x="120" y="330" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">證照字號：<tspan font-weight="bold">114-CS-008912</tspan></text>
  <text x="120" y="370" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">檢定成績：<tspan font-weight="bold" fill="#047857">學科 86.5 分 / 術科 92.0 分 (評定及格)</tspan></text>
  <text x="120" y="410" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">發證日期：<tspan font-weight="bold">中華民國 115 年 08 月 15 日</tspan></text>

  <!-- 官方鋼印徽章視覺 -->
  <circle cx="650" cy="380" r="60" fill="#ef4444" opacity="0.85"/>
  <circle cx="650" cy="380" r="52" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="650" y="375" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">勞動部技能檢定</text>
  <text x="650" y="395" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">合格發證印</text>
</svg>
