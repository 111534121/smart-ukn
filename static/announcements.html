<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校園公告｜Smart UKN</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: #f4f5f3; color: #1f2937; }
  header { background: #16503f; color: #fff; padding: 14px 16px; font-weight: 700; }
  main { padding: 16px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .muted { color: #64748b; font-size: 13px; }
  .msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; }
  .msg.error { background: #fef2f2; color: #b91c1c; }
  .ann-title { font-weight: 700; font-size: 15px; }
  .ann-meta { color: #64748b; font-size: 12px; margin-top: 2px; }
  .ann-content { font-size: 14px; margin-top: 8px; white-space: pre-wrap; line-height: 1.6; }
  #hint { font-size: 12px; color: #94a3b8; text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<header>Smart UKN · 校園公告</header>
<main>
  <div id="hint">載入中…</div>
  <div id="app" hidden></div>
</main>
<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function show(html) {
  document.getElementById('hint').hidden = true;
  const app = document.getElementById('app');
  app.hidden = false;
  app.innerHTML = html;
}

function renderAnnouncements(items) {
  if (!items.length) { show('<p class="muted">目前沒有公告。</p>'); return; }
  show(items.map(a => `
    <div class="card">
      <div class="ann-title">${esc(a.title)}</div>
      <div class="ann-meta">${esc(a.publish_date)}${a.office ? ` · ${esc(a.office)}` : ''}${a.target_class ? ` · ${esc(a.target_class)}` : ''}</div>
      <div class="ann-content">${esc(a.content || '')}</div>
    </div>`).join(''));
}

(async () => {
  try {
    const res = await fetch('/api/campus/announcements');
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.status === 'error') throw new Error(body.message || '發生錯誤');
    renderAnnouncements(body.data || []);
  } catch (e) {
    show(`<div class="card msg error">公告載入失敗：${esc(e.message)}</div>`);
  }
})();
</script>
</body>
</html>
