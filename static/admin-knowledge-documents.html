<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>校務知識文件管理</title>
<style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#172b45;margin:0}header{background:#003377;color:white;padding:18px max(20px,calc((100vw - 900px)/2));display:flex;justify-content:space-between}header a{color:white}main{max-width:900px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid #dce5ee;border-radius:10px;padding:20px;margin:14px 0}label{display:block;margin:10px 0;font-weight:600}input,select{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid #afbdce;border-radius:6px;box-sizing:border-box}button{background:#003377;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}.muted{color:#5b6b7f}.row{border-top:1px solid #e2e8f0;padding:12px 0}</style>
</head><body><header><strong>康寧大學 · 知識庫文件管理</strong><a href="/admin">返回管理後台</a></header>
<main><h1>校務知識文件管理</h1><p class="muted">上傳含可選取文字的正式 PDF。招生與課務類文件會供訪客諮詢引用，回答附文件名稱與頁碼；掃描影像 PDF 須先做 OCR。請只上傳可公開的最新版本。</p>
<section class="card"><h2>上傳 PDF</h2><form id="uploadForm"><label>文件名稱<input name="title" maxlength="100" required></label><label>類型<select name="kind"><option>招生</option><option>課務</option><option>校規</option><option>表單</option></select></label><label>PDF 檔案<input type="file" name="file" accept=".pdf" required></label><button type="submit">上傳並加入搜尋</button></form><p id="message" role="status"></p></section>
<section class="card"><h2>已上傳文件</h2><div id="documentList">載入中…</div></section></main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options){const response=await fetch(url,options),body=await response.json();if(!response.ok||body.status!=='success')throw new Error(body.message||'操作失敗');return body;}
async function load(){const rows=(await api('/api/admin/knowledge-documents')).data;$('documentList').innerHTML=rows.length?rows.map(d=>`<div class="row"><strong>${esc(d.title)}</strong> · ${esc(d.kind)} · 已索引 ${d.page_count} 頁${d.pdf_page_count?`／原檔 ${d.pdf_page_count} 頁`:''} <small>${esc(d.updated_at)}</small><p><a href="/api/admin/knowledge-documents/${encodeURIComponent(d.id)}/file">下載 ${esc(d.file_name)}</a>${d.source_url?` · <a href="${esc(d.source_url)}" target="_blank" rel="noopener noreferrer">官網原檔</a>`:''}</p><button type="button" data-replace="${esc(d.id)}" data-title="${esc(d.title)}" data-kind="${esc(d.kind)}">更新 PDF</button></div>`).join(''):'<p class="muted">尚無文件。</p>';}
$('uploadForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;try{await api('/api/admin/knowledge-documents',{method:'POST',body:new FormData(event.target)});event.target.reset();$('message').textContent='已加入搜尋';await load();}catch(e){$('message').textContent=e.message;}finally{button.disabled=false;}});
$('documentList').addEventListener('click',event=>{const button=event.target.closest('[data-replace]');if(!button)return;const file=document.createElement('input');file.type='file';file.accept='.pdf';file.onchange=async()=>{const body=new FormData();body.set('title',button.dataset.title);body.set('kind',button.dataset.kind);body.set('file',file.files[0]);try{await api('/api/admin/knowledge-documents/'+encodeURIComponent(button.dataset.replace),{method:'POST',body});$('message').textContent='PDF 已更新';await load();}catch(e){$('message').textContent=e.message;}};file.click();});
load().catch(e=>{$('message').textContent=e.message;});
</script></body></html>
