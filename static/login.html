<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA：可加到手機主畫面 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#003377">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="康寧校園">
    <title>康寧大學 學生學習與校務服務系統 - 帳號登入</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 康寧大學官網色系：深藍為主色，橘色只用於細線與圓點點綴
                        ukn: {
                            50: '#f2f5fa',
                            100: '#e1e8f3',
                            200: '#b7cfe6',
                            300: '#8fb0d6',
                            400: '#5b86c0',
                            500: '#2f64ad',
                            600: '#124aa4',
                            700: '#003c9d',
                            800: '#003377',
                            900: '#00295f',
                            950: '#001d44',
                        },
                        accent: {
                            50: '#fff4ef',
                            500: '#ff5511',
                        }
                    },
                    fontFamily: {
                        sans: ['"Microsoft JhengHei"', '"Noto Sans TC"', '"PingFang TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* ---- 康寧大學官網風格 ---- */
        body { color: #444; }
        /* 頁首：深藍頂線 + 橘色細線 (比照官網) */
        .ukn-header { background: #fff; border-top: 8px solid #003c9d; border-bottom: 1px solid #e2e8f0; }
        .ukn-header::before { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 3px; background: #ff5511; }
        /* 區塊標題：橘色圓點 */
        .ukn-title { position: relative; padding-left: 16px; color: #003377; }
        .ukn-title::before { content: ""; position: absolute; left: 2px; top: 50%; margin-top: -3.5px; width: 7px; height: 7px; border-radius: 50%; background: #ff5511; }
        /* 頁尾：深藍底白字 */
        .ukn-footer { background: #003377; color: #fff; }
        .ukn-footer a { color: #fff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f5f6f8] min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-ukn-700 selection:text-white">

    <!-- 頁首 (比照康寧大學官網) -->
    <header class="ukn-header relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center gap-4">
            <a href="/" class="flex items-center gap-3 min-w-0">
                <img src="/img/ukn-logo.png" alt="康寧大學 University of Kang Ning" class="h-9 sm:h-11 w-auto shrink-0">
                <span class="hidden sm:block border-l border-slate-300 pl-3 leading-tight">
                    <span class="block text-ukn-800 font-bold text-base">學生學習與校務服務系統</span>
                    <span class="block text-[11px] text-slate-500 mt-0.5">單一身分登入</span>
                </span>
            </a>
            <a href="/" class="text-xs border border-slate-300 text-slate-600 hover:border-ukn-700 hover:text-ukn-800 px-3 py-1.5 rounded transition whitespace-nowrap">不登入，直接逛逛 ➔</a>
        </div>
    </header>

    <!-- 主卡片登入區 -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="max-w-md w-full bg-white rounded border border-slate-200 p-6 sm:p-8 space-y-6">
            
            <div class="text-center space-y-1">
                <h1 class="text-xl sm:text-2xl font-bold text-ukn-800">校務系統身分登入</h1>
                <p class="text-xs text-slate-500">請輸入您的學號或教職員帳號進行身分驗證</p>
            </div>

            <!-- 分頁切換鈕 -->
            <div class="flex bg-slate-100 p-1 rounded text-xs sm:text-sm font-semibold">
                <button onclick="switchLoginTab('member')" id="tabBtn-member" class="flex-1 py-2 rounded bg-white text-ukn-900 transition">
                    在校師生 / 家長
                </button>
                <button onclick="switchLoginTab('visitor')" id="tabBtn-visitor" class="flex-1 py-2 rounded text-slate-600 hover:text-slate-900 transition">
                    訪客 / 新生登記通道
                </button>
            </div>

            <!-- 1. 在校師生與家長登入表單 -->
            <div id="panel-member" class="space-y-4">
                <form onsubmit="handleMemberLogin(event)" class="space-y-4 text-xs sm:text-sm">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">帳號 (學號 / 教職員代號)</label>
                        <input type="text" id="mUsername" placeholder="例如：student1 或 S112001" required
                               class="w-full px-4 py-2.5 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label class="block font-semibold text-slate-700">密碼</label>
                            <span id="mPasswordRuleText" class="text-[11px] text-slate-400">僅限半形數字</span>
                        </div>
                        <input type="password" id="mPassword" placeholder="預設密碼 123456" required
                               inputmode="numeric" autocomplete="current-password"
                               class="w-full px-4 py-2.5 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                        <p id="mPasswordHint" class="text-xs text-rose-600 mt-1 hidden font-semibold flex items-center gap-1">
                            <span>⚠️</span>
                            <span id="mPasswordHintText"></span>
                        </p>
                    </div>

                    <label class="flex items-center gap-2 text-slate-700 cursor-pointer select-none">
                        <input type="checkbox" id="mRemember" checked class="h-4 w-4 rounded border-slate-300">
                        <span>記住我（30 天內不用再登入，公用電腦請取消勾選）</span>
                    </label>

                    <div id="loginErrorMsg" class="hidden p-3 rounded bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold"></div>

                    <button type="submit" id="loginBtn" class="w-full py-2.5 rounded bg-ukn-800 hover:bg-ukn-900 text-white font-bold transition flex items-center justify-center space-x-1.5">
                        <span>登入系統</span>
                        <span>➔</span>
                    </button>
                </form>

                <!-- 展示快捷測試帳號一鍵填入 -->
                <div class="pt-4 border-t border-slate-100 space-y-2">
                    <span class="text-[11px] font-semibold text-slate-500 block text-center">快捷填入測試帳號（點擊即填入）：</span>
                    <div class="grid grid-cols-2 gap-2 text-xs font-semibold">
                        <button type="button" onclick="fillAccount('student1', '123456')" class="p-2 rounded bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-ukn-900">學生：王小明</div>
                            <div class="text-[10px] text-slate-500 font-normal">S112001 (資管五忠)</div>
                        </button>
                        <button type="button" onclick="fillAccount('S112004', '123456')" class="p-2 rounded bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-ukn-900">學生：陳冠宇</div>
                            <div class="text-[10px] text-slate-500 font-normal">學號登入 S112004 (全數及格)</div>
                        </button>
                        <button type="button" onclick="fillAccount('S112005', '123456')" class="p-2 rounded bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-ukn-900">學生：林雨潔</div>
                            <div class="text-[10px] text-slate-500 font-normal">學號登入 S112005 (資料結構未過)</div>
                        </button>
                        <button type="button" onclick="fillAccount('parent1', '123456')" class="p-2 rounded bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-amber-900">家長：王大明</div>
                            <div class="text-[10px] text-slate-500 font-normal">學生王小明之家長</div>
                        </button>
                        <button type="button" onclick="fillAccount('teacher1', '123456')" class="p-2 rounded bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-ukn-900">導師：彭賓鈺</div>
                            <div class="text-[10px] text-slate-500 font-normal">資管五忠導師</div>
                        </button>
                        <button type="button" onclick="fillAccount('dorm_demo', '123456')" class="p-2 rounded bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-ukn-900">宿舍行政人員</div>
                            <div class="text-[10px] text-slate-500 font-normal">dorm_demo／123456 · 宿舍審核與住宿案件</div>
                        </button>
                        <button type="button" onclick="fillAccount('demo_assistant_cs', '123456')" class="p-2 rounded bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-purple-900">科助：資訊管理科</div>
                            <div class="text-[10px] text-slate-500 font-normal">demo_assistant_cs／123456 · 科務工作台</div>
                        </button>
                        <button type="button" onclick="fillAccount('admin', 'admin123')" class="p-2 rounded bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-emerald-900">管理員：系統後台</div>
                            <div class="text-[10px] text-slate-500 font-normal">CMS 規章維護權限</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 2. 訪客/未來學生/未來家長登記通道 -->
            <div id="panel-visitor" class="hidden space-y-4">
                <div class="bg-amber-50 p-3.5 rounded border border-amber-200 text-xs text-amber-950 space-y-1">
                    <div class="font-bold flex items-center gap-1">
                        <span>訪客快速登記與校園諮詢</span>
                    </div>
                    <p class="text-amber-900 leading-relaxed">提供未來新生、家長與校外貴賓查閱本校規章、科系介紹與行政申辦資訊。</p>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1.5 text-xs sm:text-sm">您的身分 *</label>
                    <div class="grid grid-cols-2 gap-2" id="visitorTypeGroup">
                        <button type="button" data-type="未來學生" onclick="selectVisitorType('未來學生')"
                            class="visitor-type-btn py-2 rounded border-2 border-amber-500 bg-amber-50 text-amber-950 font-bold text-xs transition flex items-center justify-center gap-1.5">
                            <span>未來學生</span>
                        </button>
                        <button type="button" data-type="未來家長" onclick="selectVisitorType('未來家長')"
                            class="visitor-type-btn py-2 rounded border-2 border-slate-200 bg-white text-slate-600 font-bold text-xs transition flex items-center justify-center gap-1.5 hover:border-slate-300">
                            <span>未來家長</span>
                        </button>
                    </div>
                </div>

                <form onsubmit="handleVisitorRegister(event)" class="space-y-3 text-xs sm:text-sm">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">姓名 / 稱謂 *</label>
                        <input type="text" id="vName" placeholder="例如：陳同學、林家長" required
                               class="w-full px-3 py-2 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">聯絡手機 *</label>
                        <input type="tel" id="vPhone" placeholder="例如：0912-345-678" required
                               class="w-full px-3 py-2 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">就讀 / 畢業學校 *</label>
                        <input type="text" id="vSchool" list="schoolOptions" placeholder="請選擇或輸入學校名稱" required
                               class="w-full px-3 py-2 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                        <datalist id="schoolOptions">
                            <option value="台北市立南港高中">
                            <option value="台北市立內湖高工">
                            <option value="新北市立汐止國中">
                            <option value="新北市立秀峰高中">
                            <option value="基隆市立安樂高中">
                            <option value="國立基隆商工">
                            <option value="其他國高中職學校">
                        </datalist>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">來訪目的 *</label>
                            <select id="vPurpose" class="w-full px-3 py-2 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white text-xs">
                                <option value="升學諮詢與科系探索">升學諮詢</option>
                                <option value="五專免試入學諮詢">五專入學</option>
                                <option value="校園環境參觀">校園參觀</option>
                                <option value="洽公與交流活動">洽公交流</option>
                                <option value="校友回校查詢">校友回校</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">感興趣科系</label>
                            <select id="vTargetDept" class="w-full px-3 py-2 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white text-xs">
                                <optgroup label="護理健康學院">
                                    <option value="長期照護學系">長期照護學系</option>
                                    <option value="嬰幼兒保育學系">嬰幼兒保育學系</option>
                                    <option value="護理科（五專）">護理科（五專）</option>
                                    <option value="視光科（五專）">視光科（五專）</option>
                                </optgroup>
                                <optgroup label="商業資訊學院">
                                    <option value="企業管理學系（科）">企業管理學系（科）</option>
                                    <option value="資訊管理科（五專）" selected>資訊管理科（五專）</option>
                                    <option value="數位影視動畫科（五專）">數位影視動畫科（五專）</option>
                                    <option value="應用外語科（五專）">應用外語科（五專）</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <div id="visitorErrorMsg" class="hidden p-3 rounded bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold"></div>

                    <button type="submit" id="visitorBtn" class="w-full py-2.5 rounded bg-ukn-800 hover:bg-ukn-900 text-white font-bold transition flex items-center justify-center space-x-1.5">
                        <span>完成登記並進入系統</span>
                        <span>➔</span>
                    </button>
                </form>
            </div>

        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="ukn-footer py-8 text-center text-xs sm:text-sm leading-7">
        <p class="font-bold">康寧大學 學生學習與校務服務系統</p>
        <p>地址：114 臺北市內湖區康寧路三段75巷137號 ｜ 電話：(02)2632-1181 ｜ 傳真：(02)2632-8744</p>
    </footer>

    <script>
        let selectedVisitorType = '未來學生';

        function selectVisitorType(type) {
            selectedVisitorType = type;
            document.querySelectorAll('.visitor-type-btn').forEach(btn => {
                const active = btn.dataset.type === type;
                btn.classList.toggle('border-amber-500', active);
                btn.classList.toggle('bg-amber-50', active);
                btn.classList.toggle('text-amber-950', active);
                btn.classList.toggle('border-slate-200', !active);
                btn.classList.toggle('bg-white', !active);
                btn.classList.toggle('text-slate-600', !active);
            });
        }

        function switchLoginTab(tab) {
            if (tab === 'member') {
                document.getElementById('panel-member').classList.remove('hidden');
                document.getElementById('panel-visitor').classList.add('hidden');
                document.getElementById('tabBtn-member').className = 'flex-1 py-2 rounded bg-white text-ukn-900  transition font-bold';
                document.getElementById('tabBtn-visitor').className = 'flex-1 py-2 rounded text-slate-600 hover:text-slate-900 transition';
            } else {
                document.getElementById('panel-member').classList.add('hidden');
                document.getElementById('panel-visitor').classList.remove('hidden');
                document.getElementById('tabBtn-member').className = 'flex-1 py-2 rounded text-slate-600 hover:text-slate-900 transition';
                document.getElementById('tabBtn-visitor').className = 'flex-1 py-2 rounded bg-white text-ukn-900  transition font-bold';
            }
        }

        function showPasswordHint(msg) {
            const hint = document.getElementById('mPasswordHint');
            const hintText = document.getElementById('mPasswordHintText');
            if (!hint || !hintText) return;
            hintText.textContent = msg;
            hint.classList.remove('hidden');
            clearTimeout(hint._timer);
            hint._timer = setTimeout(() => {
                hint.classList.add('hidden');
            }, 3500);
        }

        function filterPasswordInput() {
            const pInput = document.getElementById('mPassword');
            const uInput = document.getElementById('mUsername');
            const ruleText = document.getElementById('mPasswordRuleText');
            if (!pInput) return;

            const isAdmin = (uInput?.value || '').trim().toLowerCase() === 'admin';
            if (ruleText) {
                ruleText.textContent = isAdmin ? '管理員可輸入英數' : '僅限半形數字';
            }

            let val = pInput.value;
            let warned = false;

            // 1. 防呆：阻擋中文字、全形符號與空白字元
            if (/[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef\s]/.test(val)) {
                val = val.replace(/[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef\s]/g, '');
                showPasswordHint('防呆阻擋：密碼欄位不可輸入中文字元或全形符號！');
                warned = true;
            }

            // 2. 防呆：密碼欄位只能輸入數字（管理員除外）
            if (!isAdmin) {
                if (/[^0-9]/.test(val)) {
                    val = val.replace(/[^0-9]/g, '');
                    if (!warned) {
                        showPasswordHint('防呆限制：密碼僅能輸入半形數字（預設 123456），不可輸入英文或特殊符號！');
                    }
                }
            } else {
                if (/[^a-zA-Z0-9]/.test(val)) {
                    val = val.replace(/[^a-zA-Z0-9]/g, '');
                    if (!warned) {
                        showPasswordHint('管理員密碼僅能輸入半形英數字！');
                    }
                }
            }

            if (pInput.value !== val) {
                pInput.value = val;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const pInput = document.getElementById('mPassword');
            const uInput = document.getElementById('mUsername');
            if (pInput) {
                pInput.addEventListener('input', filterPasswordInput);
                pInput.addEventListener('paste', () => setTimeout(filterPasswordInput, 10));
                pInput.addEventListener('compositionend', filterPasswordInput);
            }
            if (uInput) {
                uInput.addEventListener('input', () => {
                    const isAdmin = uInput.value.trim().toLowerCase() === 'admin';
                    const ruleText = document.getElementById('mPasswordRuleText');
                    if (ruleText) ruleText.textContent = isAdmin ? '管理員可輸入英數' : '僅限半形數字';
                    filterPasswordInput();
                });
            }
        });

        function fillAccount(u, p) {
            document.getElementById('mUsername').value = u;
            document.getElementById('mPassword').value = p;
            filterPasswordInput();
        }

        async function handleMemberLogin(e) {
            e.preventDefault();
            const u = document.getElementById('mUsername').value.trim();
            const p = document.getElementById('mPassword').value.trim();
            const errBox = document.getElementById('loginErrorMsg');
            const btn = document.getElementById('loginBtn');

            errBox.classList.add('hidden');

            // 送出前嚴格防呆阻絕
            if (/[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]/.test(p)) {
                errBox.textContent = '密碼格式錯誤：密碼不可包含中文字元或全形字元！請輸入半形數字。';
                errBox.classList.remove('hidden');
                return;
            }
            if (u.toLowerCase() !== 'admin' && !/^\d+$/.test(p)) {
                errBox.textContent = '密碼格式錯誤：密碼欄位僅能輸入半形數字（預設密碼為 123456）！';
                errBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span>登入驗證中...</span>`;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p, remember: document.getElementById('mRemember').checked })
                });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    window.location.href = data.user.workbench_url || '/';
                } else {
                    errBox.textContent = data.message || '帳號或密碼錯誤';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.textContent = '連不上系統，請確認程式已經開啟';
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>登入系統</span><span>➔</span>`;
            }
        }

        async function handleVisitorRegister(e) {
            e.preventDefault();
            const payload = {
                visitor_name: document.getElementById('vName').value.trim(),
                phone: document.getElementById('vPhone').value.trim(),
                school_from: document.getElementById('vSchool').value.trim(),
                purpose: document.getElementById('vPurpose').value,
                target_dept: document.getElementById('vTargetDept').value,
                visitor_type: selectedVisitorType
            };
            const errBox = document.getElementById('visitorErrorMsg');
            const btn = document.getElementById('visitorBtn');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<span>登記中...</span>`;

            try {
                const res = await fetch('/api/visitor/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    window.location.href = '/';
                } else {
                    errBox.textContent = data.message || '登記失敗，請檢查有沒有漏填';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.textContent = '連不上系統，請稍後再試';
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>完成登記並進入系統</span><span>➔</span>`;
            }
        }
    </script>
    <script>
        // PWA：註冊 Service Worker (需 https 或 localhost 才會生效)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW 註冊失敗', err)));
        }
    </script>
