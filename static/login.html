<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康寧大學 學生學習與校務服務系統 - 帳號登入</title>
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ukn: {
                            50: '#f0f4f9',
                            100: '#dde6f2',
                            700: '#274976',
                            800: '#233f63',
                            900: '#1b324f',
                            950: '#101e31',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased text-slate-800 selection:bg-ukn-700 selection:text-white">

    <!-- 頂部官方導覽列 -->
    <header class="bg-ukn-900 text-white p-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-amber-500 flex items-center justify-center font-black text-ukn-950 text-lg shadow">
                    UKN
                </div>
                <div>
                    <span class="text-base sm:text-lg font-bold tracking-tight">康寧大學 學生學習與校務服務系統</span>
                    <p class="text-xs text-slate-300">單一身分登入門戶 (Single Sign-On)</p>
                </div>
            </a>
            
            <a href="/" class="text-xs text-slate-200 hover:text-white bg-white/10 hover:bg-white/20 px-3.5 py-1.5 rounded-lg transition border border-white/10 flex items-center gap-1">
                <span>直接瀏覽前台 ➔</span>
            </a>
        </div>
    </header>

    <!-- 主卡片登入區 -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="max-w-md w-full bg-white rounded-xl shadow-md border border-slate-200 p-6 sm:p-8 space-y-6">
            
            <div class="text-center space-y-1">
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">校務系統身分登入</h1>
                <p class="text-xs text-slate-500">請輸入您的學號或教職員帳號進行身分驗證</p>
            </div>

            <!-- 分頁切換鈕 -->
            <div class="flex bg-slate-100 p-1 rounded-lg text-xs sm:text-sm font-semibold">
                <button onclick="switchLoginTab('member')" id="tabBtn-member" class="flex-1 py-2 rounded bg-white text-ukn-900 shadow-sm transition">
                    在校師生 / 家長
                </button>
                <button onclick="switchLoginTab('visitor')" id="tabBtn-visitor" class="flex-1 py-2 rounded text-slate-600 hover:text-slate-900 transition">
                    訪客 / 新生登記通道
                </button>
            </div>

            <!-- 1. 在校師生與家長登入表單 -->
            <div id="panel-member" class="space-y-4">
                <form onsubmit="handleMemberLogin(event)" class="space-y-4 text-xs sm:text-sm">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">帳號 (學號 / 教職員代號)</label>
                        <input type="text" id="mUsername" placeholder="例如：student1 或 S112001" required
                               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">密碼</label>
                        <input type="password" id="mPassword" placeholder="預設密碼 123456" required
                               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                    </div>

                    <div id="loginErrorMsg" class="hidden p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold"></div>

                    <button type="submit" id="loginBtn" class="w-full py-2.5 rounded-lg bg-ukn-800 hover:bg-ukn-900 text-white font-bold transition shadow flex items-center justify-center space-x-1.5">
                        <span>登入系統</span>
                        <span>➔</span>
                    </button>
                </form>

                <!-- 展示快捷測試帳號一鍵填入 -->
                <div class="pt-4 border-t border-slate-100 space-y-2">
                    <span class="text-[11px] font-semibold text-slate-500 block text-center">快捷填入測試帳號（點擊即填入）：</span>
                    <div class="grid grid-cols-2 gap-2 text-xs font-semibold">
                        <button onclick="fillAccount('student1', '123456')" class="p-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-ukn-900">👨‍🎓 學生：王小明</div>
                            <div class="text-[10px] text-slate-500 font-normal">S112001 (資科系)</div>
                        </button>
                        <button onclick="fillAccount('parent1', '123456')" class="p-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-amber-900">👨‍👩‍👦 家長：王大明</div>
                            <div class="text-[10px] text-slate-500 font-normal">學生王小明之家長</div>
                        </button>
                        <button onclick="fillAccount('teacher1', '123456')" class="p-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-ukn-900">👩‍🏫 導師：陳雅婷</div>
                            <div class="text-[10px] text-slate-500 font-normal">資訊科技學系導師</div>
                        </button>
                        <button onclick="fillAccount('admin', 'admin123')" class="p-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-800 transition border border-slate-200 text-left">
                            <div class="font-bold text-emerald-900">⚙️ 管理員：系統後台</div>
                            <div class="text-[10px] text-slate-500 font-normal">CMS 規章維護權限</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 2. 訪客/未來學生/未來家長登記通道 -->
            <div id="panel-visitor" class="hidden space-y-4">
                <div class="bg-amber-50 p-3.5 rounded-lg border border-amber-200 text-xs text-amber-950 space-y-1">
                    <div class="font-bold flex items-center gap-1">
                        <span>📌</span>
                        <span>訪客快速登記與校園諮詢</span>
                    </div>
                    <p class="text-amber-900 leading-relaxed">提供未來新生、家長與校外貴賓查閱本校規章、科系介紹與行政申辦資訊。</p>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1.5 text-xs sm:text-sm">您的身分 *</label>
                    <div class="grid grid-cols-2 gap-2" id="visitorTypeGroup">
                        <button type="button" data-type="未來學生" onclick="selectVisitorType('未來學生')"
                            class="visitor-type-btn py-2 rounded-lg border-2 border-amber-500 bg-amber-50 text-amber-950 font-bold text-xs transition flex items-center justify-center gap-1.5">
                            <span>未來學生</span>
                        </button>
                        <button type="button" data-type="未來家長" onclick="selectVisitorType('未來家長')"
                            class="visitor-type-btn py-2 rounded-lg border-2 border-slate-200 bg-white text-slate-600 font-bold text-xs transition flex items-center justify-center gap-1.5 hover:border-slate-300">
                            <span>未來家長</span>
                        </button>
                    </div>
                </div>

                <form onsubmit="handleVisitorRegister(event)" class="space-y-3 text-xs sm:text-sm">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">姓名 / 稱謂 *</label>
                        <input type="text" id="vName" placeholder="例如：陳同學、林家長" required
                               class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">聯絡手機 *</label>
                        <input type="tel" id="vPhone" placeholder="例如：0912-345-678" required
                               class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">就讀 / 畢業學校 *</label>
                        <input type="text" id="vSchool" list="schoolOptions" placeholder="請選擇或輸入學校名稱" required
                               class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white transition">
                        <datalist id="schoolOptions">
                            <option value="台北市立南港高中">
                            <option value="台北市立內湖高工">
                            <option value="新北市立汐止國中">
                            <option value="新北市立秀峰高中">
                            <option value="基隆市立安樂高中">
                            <option value="國立基隆商工">
                            <option value="其他國高中職學校">
                        </datalist>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">來訪目的 *</label>
                            <select id="vPurpose" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white text-xs">
                                <option value="升學諮詢與系所探索">升學諮詢</option>
                                <option value="五專免試入學諮詢">五專入學</option>
                                <option value="校園環境參觀">校園參觀</option>
                                <option value="洽公與交流活動">洽公交流</option>
                                <option value="校友回校查詢">校友回校</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">感興趣科系</label>
                            <select id="vTargetDept" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-ukn-500 bg-slate-50 focus:bg-white text-xs">
                                <option value="資訊科技與應用學系">資訊科技系</option>
                                <option value="護理學系">護理學系</option>
                                <option value="幼兒保育學系">幼兒保育系</option>
                                <option value="應用外語學系">應用外語系</option>
                                <option value="長期照護學系">長期照護系</option>
                            </select>
                        </div>
                    </div>

                    <div id="visitorErrorMsg" class="hidden p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold"></div>

                    <button type="submit" id="visitorBtn" class="w-full py-2.5 rounded-lg bg-ukn-800 hover:bg-ukn-900 text-white font-bold transition shadow flex items-center justify-center space-x-1.5">
                        <span>完成登記並進入系統</span>
                        <span>➔</span>
                    </button>
                </form>
            </div>

        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="p-4 text-center text-xs text-slate-500">
        康寧大學 學生學習與校務服務系統 · University of Kang Ning
    </footer>

    <script>
        let selectedVisitorType = '未來學生';

        function selectVisitorType(type) {
            selectedVisitorType = type;
            document.querySelectorAll('.visitor-type-btn').forEach(btn => {
                const active = btn.dataset.type === type;
                btn.classList.toggle('border-amber-500', active);
                btn.classList.toggle('bg-amber-50', active);
                btn.classList.toggle('text-amber-950', active);
                btn.classList.toggle('border-slate-200', !active);
                btn.classList.toggle('bg-white', !active);
                btn.classList.toggle('text-slate-600', !active);
            });
        }

        function switchLoginTab(tab) {
            if (tab === 'member') {
                document.getElementById('panel-member').classList.remove('hidden');
                document.getElementById('panel-visitor').classList.add('hidden');
                document.getElementById('tabBtn-member').className = 'flex-1 py-2 rounded bg-white text-ukn-900 shadow-sm transition font-bold';
                document.getElementById('tabBtn-visitor').className = 'flex-1 py-2 rounded text-slate-600 hover:text-slate-900 transition';
            } else {
                document.getElementById('panel-member').classList.add('hidden');
                document.getElementById('panel-visitor').classList.remove('hidden');
                document.getElementById('tabBtn-member').className = 'flex-1 py-2 rounded text-slate-600 hover:text-slate-900 transition';
                document.getElementById('tabBtn-visitor').className = 'flex-1 py-2 rounded bg-white text-ukn-900 shadow-sm transition font-bold';
            }
        }

        function fillAccount(u, p) {
            document.getElementById('mUsername').value = u;
            document.getElementById('mPassword').value = p;
        }

        async function handleMemberLogin(e) {
            e.preventDefault();
            const u = document.getElementById('mUsername').value.trim();
            const p = document.getElementById('mPassword').value.trim();
            const errBox = document.getElementById('loginErrorMsg');
            const btn = document.getElementById('loginBtn');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<span>登入驗證中...</span>`;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    window.location.href = '/';
                } else {
                    errBox.textContent = data.message || '帳號或密碼錯誤';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.textContent = '無法連線至伺服器，請確認後端已啟動';
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>登入系統</span><span>➔</span>`;
            }
        }

        async function handleVisitorRegister(e) {
            e.preventDefault();
            const payload = {
                visitor_name: document.getElementById('vName').value.trim(),
                phone: document.getElementById('vPhone').value.trim(),
                school_from: document.getElementById('vSchool').value.trim(),
                purpose: document.getElementById('vPurpose').value,
                target_dept: document.getElementById('vTargetDept').value,
                visitor_type: selectedVisitorType
            };
            const errBox = document.getElementById('visitorErrorMsg');
            const btn = document.getElementById('visitorBtn');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<span>登記中...</span>`;

            try {
                const res = await fetch('/api/visitor/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    window.location.href = '/';
                } else {
                    errBox.textContent = data.message || '登記失敗，請檢查欄位';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.textContent = '無法連線至伺服器';
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>完成登記並進入系統</span><span>➔</span>`;
            }
        }
    </script>
</body>
</html>
