<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資管科成果與榮譽｜康寧大學</title><style>
:root{font-family:system-ui,sans-serif;color:#19314a;background:#f4f7fb}body{margin:0}header{background:#073a69;color:white;padding:24px max(20px,calc((100vw - 1060px)/2))}header a{color:white}main{max-width:1060px;margin:28px auto;padding:0 18px}h1{margin:.3em 0}h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.card{background:white;border:1px solid #dce5ee;border-radius:14px;padding:20px;margin-bottom:18px}.entry{border-top:1px solid #e2e9f0;padding:14px 0}.entry:first-child{border:0}.muted{color:#61758a;font-size:.9em}.tag{display:inline-block;background:#e7f1fb;color:#174f7e;border-radius:20px;padding:2px 10px;font-size:.8em}label{display:block;margin:10px 0;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #b9c8d8;border-radius:8px;padding:10px;font:inherit}textarea{min-height:80px}button{background:#105d98;color:white;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}button.secondary{background:#e8f1fa;color:#164a74}button.danger{background:#8b3943}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;background:#fff5df;border-radius:8px}.error{color:#ad2633}
</style></head><body><header><a href="/">← 校園首頁</a><h1>資管科成果與榮譽</h1><div>學生與老師投稿，科助確認後發布</div></header><main><p id="message" role="status"></p><div class="grid"><section class="card"><h2>近期成果</h2><label>得獎年度<select id="year"><option value="">全部年度</option></select></label><div id="publicList">載入中…</div></section><div><section class="card" id="submitPanel" hidden><h2>投稿得獎消息</h2><form id="submitForm"><label>分類<select name="kind"><option>競賽</option><option>證照</option><option>專題</option><option>其他</option></select></label><label>比賽或成果名稱<input name="contest_name" required maxlength="120"></label><label>獎項<input name="award" required maxlength="120"></label><label>得獎日期<input name="award_date" type="date" required></label><label>補充說明<textarea name="description" maxlength="2000"></textarea></label><label>佐證資料（PDF、JPG、PNG，10 MB 內）<input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required></label><button>送交科助審核</button></form><h3>我的投稿</h3><div id="mineList"></div></section><section class="card" id="reviewPanel" hidden><h2>待審核成果</h2><div id="reviewList">載入中…</div><h3>分類更新提醒</h3><div id="reminders"></div><h3>已發布成果維護</h3><div id="publishedManage"></div></section></div></div></main><script src="/js/achievements.js?v=4"></script></body></html>
